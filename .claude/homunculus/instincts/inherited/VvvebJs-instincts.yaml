# VvvebJs Workflow Fix Bug In Component Or Widget

## Action

Follow the fix-bug-in-component-or-widget workflow:
1. Identify the bug in a builder component or widget.
2. Modify the relevant file in libs/builder/components-*.js.
3. Commit with a message referencing the fix.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: libs/builder/components-elements.js, libs/builder/components-widgets.js

